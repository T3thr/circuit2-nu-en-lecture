<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundamental Cut-set Diagram (Tree = {1, 2})</title>
    <style>
        body {
            margin: 0;
            padding: 24px;
            background: #0f172a;
            color: #f8fafc;
            font-family: 'Sarabun', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 24px;
            max-width: 1200px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid #334155;
            margin-bottom: 24px;
        }
        img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
        }
        h1 {
            font-size: 24px;
            color: #38bdf8;
            margin-top: 0;
        }
        p {
            color: #94a3b8;
            font-size: 16px;
            line-height: 1.6;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
        }
        .badge-tree { background: #2563eb; color: #fff; }
        .badge-link { background: #475569; color: #fff; }
    </style>
</head>
<body>
    <div class="card">
        <h1>📐 Fundamental Cut-set Diagram (Tree = {1, 2})</h1>
        <p>
            การวิเคราะห์ชุดตัดพื้นฐานแบบถูกต้องตามหลักการคำนวณ เมื่อกำหนดให้ 
            <span class="badge badge-tree">กิ่ง 1 และ 2 เป็น Tree Twigs (เส้นหนา)</span> และ 
            <span class="badge badge-link">กิ่ง 3, 4, 5 เป็น Links (เส้นบาง)</span>
        </p>
        <img src="cut_set_detailed.png" alt="Fundamental Cut-set Diagram">
    </div>
</body>
</html>
